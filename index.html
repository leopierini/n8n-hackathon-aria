<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARIA</title>
<link rel="icon" type="image/png" href="Assets/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root {
  --cream: #F5F0E8;
  --clay: #C8B49A;
  --terracotta: #A0674A;
  --ash: #6E6A65;
  --charcoal: #2A2620;
  --white: #FDFAF5;
  --blue: #2645B0;
  --serif: 'Cormorant Garamond', 'Palatino Linotype', Palatino, Georgia, serif;
  --sans: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: var(--cream); }
body { font-family: var(--sans); font-weight: 300; color: var(--charcoal); }

/* ── CORNER LABELS ── */
.corner {
  position: fixed; z-index: 10;
  font-family: var(--sans); font-size: 0.62rem;
  letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--ash); opacity: 0;
  animation: fadeUp 0.8s ease 2s forwards;
}
.corner-tl { top: 1.8rem; left: 2.4rem; }
.corner-tr { top: 1.8rem; right: 2.4rem; display:flex; align-items:center; gap:7px; }

.live-dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: #5CAD7E; opacity: 0;
  animation: fadeIn 0.6s ease 2.3s forwards, livePulse 2.4s ease-in-out 2.3s infinite;
}
@keyframes livePulse { 0%,100%{opacity:1} 50%{opacity:0.2} }
@keyframes fadeIn { to { opacity:1; } }

/* ── STAGE ── */
.stage {
  position: relative; z-index: 1;
  height: 100vh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 0 2rem;
  text-align: center;
  /* shift content up ~6% so it feels optically centered with bottom label */
  margin-top: -5vh;
}

/* ── LOGO ── */
.logo-wrap {
  opacity: 0; transform: translateY(28px);
  animation: fadeUp 1.1s cubic-bezier(.22,1,.36,1) 0.1s forwards;
}

.logo-img {
  width: clamp(190px, 26vw, 280px);
  height: clamp(190px, 26vw, 280px);
  object-fit: contain;
  border-radius: 50%;
  filter:
    drop-shadow(0 6px 32px rgba(42,38,32,0.18))
    drop-shadow(0 2px 8px rgba(42,38,32,0.10));
  transition:
    transform 0.7s cubic-bezier(.34,1.56,.64,1),
    filter 0.4s ease;
  cursor: default;
  display: block;
}
.logo-img:hover {
  transform: scale(1.05) rotate(-2deg);
  filter:
    drop-shadow(0 14px 44px rgba(38,69,176,0.24))
    drop-shadow(0 2px 8px rgba(42,38,32,0.10));
}

/* ── TEXT GROUP ── */
.text-group {
  margin-top: 24px;
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  opacity: 0; transform: translateY(16px);
  animation: fadeUp 0.9s ease 0.55s forwards;
}

.wordmark {
  font-family: var(--serif);
  font-weight: 300;
  font-size: clamp(3.4rem, 7vw, 5rem);
  letter-spacing: 0.46em;
  padding-left: 0.46em;
  text-transform: uppercase;
  color: var(--charcoal);
  line-height: 1;
  text-shadow: 0 1px 20px rgba(245,240,232,0.7);
}

.tagline {
  font-family: var(--serif);
  font-style: italic;
  font-weight: 300;
  font-size: clamp(1rem, 1.6vw, 1.22rem);
  color: var(--charcoal);
  letter-spacing: 0.04em;
  line-height: 1.5;
  opacity: 0.82;
  text-shadow: 0 1px 12px rgba(245,240,232,0.6);
}

/* ── RULE ── */
.rule {
  width: 48px; height: 0.5px;
  background: var(--clay);
  margin-top: 26px;
  opacity: 0; transform: scaleX(0); transform-origin: center;
  animation: scaleIn 0.7s ease 1.05s forwards;
}
@keyframes scaleIn { to { opacity:1; transform:scaleX(1); } }

/* ── CTA ── */
.cta-wrap {
  margin-top: 26px;
  opacity: 0; transform: translateY(10px);
  animation: fadeUp 0.9s ease 1.15s forwards;
}

.cta-btn {
  display: inline-flex; align-items: center; gap: 14px;
  padding: 15px 40px;
  background: var(--charcoal);
  color: var(--white);
  font-family: var(--sans);
  font-size: 0.82rem;
  font-weight: 400;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  text-decoration: none;
  border-radius: 2px;
  border: 1px solid var(--charcoal);
  cursor: pointer;
  position: relative; overflow: hidden;
  transition: gap 0.32s ease;
}
.cta-btn::before {
  content: ''; position: absolute; inset: 0;
  background: var(--blue);
  transform: scaleX(0); transform-origin: left;
  transition: transform 0.42s cubic-bezier(.77,0,.175,1);
  z-index: 0;
}
.cta-btn:hover::before { transform: scaleX(1); }
.cta-btn:hover { gap: 22px; }
.cta-btn span, .cta-btn svg { position: relative; z-index: 1; }
.cta-btn svg {
  width: 15px; height: 15px;
  stroke: currentColor; fill: none;
  stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;
  transition: transform 0.3s ease; flex-shrink: 0;
}
.cta-btn:hover svg { transform: translateX(5px); }

/* ── BOTTOM LABEL — centred vertically between content and edge ── */
.bottom {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  /* centre in the gap between stage bottom and viewport bottom */
  height: 14vh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 10px;
  opacity: 0;
  animation: fadeUp 0.8s ease 2s forwards;
  z-index: 5;
  pointer-events: none;
}
.b-label {
  font-size: 0.65rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--ash);
  font-family: var(--sans);
}
.b-line {
  width: 1px; height: 28px;
  background: linear-gradient(to bottom, rgba(200,180,154,0.9), rgba(200,180,154,0));
  animation: breathe 2.2s ease-in-out 2s infinite;
}
@keyframes breathe {
  0%,100% { opacity:0.35; transform:scaleY(0.75); }
  50%      { opacity:1;    transform:scaleY(1); }
}

/* ── TRANSITIONS ── */
.cover {
  position: fixed; inset: 0; background: var(--cream);
  z-index: 200; pointer-events: none;
  transition: opacity 0.9s ease;
}
.cover.out { opacity: 0; }

@keyframes fadeUp {
  from { opacity:0; transform:translateY(16px); }
  to   { opacity:1; transform:translateY(0); }
}

/* ── TEAM LABEL ── */
.team-label {
  position: fixed;
  bottom: 1.8rem;
  left: 2.4rem;
  font-family: var(--sans);
  font-size: 0.58rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--ash);
  opacity: 0;
  animation: fadeUp 0.8s ease 2.1s forwards;
  z-index: 5;
  pointer-events: none;
}
/* ── LANG TOGGLE ── */
.lang-toggle {
  display: flex;
  gap: 8px;
  cursor: pointer;
  margin-left: 14px;
  position: relative;
  padding-left: 14px;
}
.lang-toggle::before {
  content: '';
  position: absolute;
  left: 0;
  top: 50%;
  transform: translateY(-50%);
  width: 1px;
  height: 10px;
  background: var(--clay);
  opacity: 0.4;
}
.lang-link {
  transition: color 0.3s, opacity 0.3s;
  opacity: 0.4;
}
.lang-link:hover {
  opacity: 0.8;
}
.lang-link.active {
  opacity: 1;
  color: var(--charcoal);
  font-weight: 500;
}
</style>
</head>
<body>

<div class="cover" id="cover"></div>

<div class="corner corner-tl" data-i18n="lab">Laboratorio ARIA</div>
<div class="corner corner-tr">
  <div class="live-dot"></div>
  <span data-i18n="phase">Fase Pilota · 2026</span>
  <div class="lang-toggle">
    <span class="lang-link active" id="lang-it" onclick="changeLanguage('it')">IT</span>
    <span class="lang-link" id="lang-en" onclick="changeLanguage('en')">EN</span>
  </div>
</div>

<main class="stage">

  <div class="logo-wrap">
    <img
      class="logo-img"
      src="Assets/logo.png"
      alt="ARIA Logo"
    >
  </div>

  <div class="text-group">
    <h1 class="wordmark">ARIA</h1>
    <p class="tagline">Autonomous Research Intelligence Assistant</p>
  </div>

  <div class="rule"></div>

  <div class="cta-wrap">
    <a class="cta-btn" href="app.html" onclick="enterApp(event)">
      <span data-i18n="cta">Entra nel laboratorio</span>
      <svg viewBox="0 0 24 24">
        <line x1="5" y1="12" x2="19" y2="12"/>
        <polyline points="12 5 19 12 12 19"/>
      </svg>
    </a>
  </div>

</main>

<div class="bottom">
  <span class="b-label">2026 · Sassuolo</span>
  <div class="b-line"></div>
</div>

<div class="team-label">Luconi &nbsp;&middot;&nbsp; Scortegagna &nbsp;&middot;&nbsp; Pierini</div>


<script>
  window.addEventListener('load', () => {
    const cover = document.getElementById('cover');
    requestAnimationFrame(() => requestAnimationFrame(() => cover.classList.add('out')));
    setTimeout(() => cover.remove(), 1100);
  });

  function enterApp(e) {
    e.preventDefault();
    const href = e.currentTarget.getAttribute('href');
    const cover = document.createElement('div');
    cover.style.cssText = 'position:fixed;inset:0;background:#F5F0E8;z-index:300;opacity:0;transition:opacity 0.55s ease;pointer-events:none;';
    document.body.appendChild(cover);
    requestAnimationFrame(() => requestAnimationFrame(() => { cover.style.opacity = '1'; }));
    setTimeout(() => { window.location.href = href; }, 680);
  }

  // --- i18n logic ---
  const i18n = {
    it: {
      lab: "Laboratorio ARIA",
      phase: "Fase Pilota · 2026",
      cta: "Entra nel laboratorio"
    },
    en: {
      lab: "ARIA Laboratory",
      phase: "Pilot Phase · 2026",
      cta: "Enter the laboratory"
    }
  };

  let currentLang = localStorage.getItem('aria_lang') || 'it';

  function updateUITexts() {
    const dict = i18n[currentLang];
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (dict[key]) el.innerHTML = dict[key];
    });

    // Update toggle active state
    document.querySelectorAll('.lang-link').forEach(link => link.classList.remove('active'));
    document.getElementById(`lang-${currentLang}`).classList.add('active');
    
    // Update html lang attribute
    document.documentElement.lang = currentLang;
  }

  function changeLanguage(lang) {
    currentLang = lang;
    localStorage.setItem('aria_lang', lang);
    updateUITexts();
  }

  // Initial call
  updateUITexts();
</script>
</body>
</html>
